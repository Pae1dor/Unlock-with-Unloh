{% extends "base.html" %}
{% set back_url = "/news" %}
{% block title %}สร้างข่าว — {{ app_name }}{% endblock %}
{% block page_title %}สร้างข่าว{% endblock %}

{% block content %}
{% if error %}<div class="notice notice--error">{{ error }}</div>{% endif %}

<form class="form" method="post" action="/news/new">
  <div class="field">
    <label for="title">หัวข้อข่าว</label>
    <input type="text" id="title" name="title" required maxlength="255" value="{{ form.get('title', '') }}">
  </div>
  <div class="field">
    <label for="category">หมวดหมู่</label>
    <select id="category" name="category">
      {% for key, label in news_categories if key != 'all' %}
      <option value="{{ key }}" {% if form.get('category') == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="summary">สรุปย่อ</label>
    <input type="text" id="summary" name="summary" maxlength="500" value="{{ form.get('summary', '') }}">
  </div>
  <div class="field">
    <label for="content">เนื้อหาข่าว</label>
    <textarea id="content" name="content" required placeholder="เขียนเนื้อหาข่าว...">{{ form.get('content', '') }}</textarea>
  </div>
  <button class="btn" type="submit">เผยแพร่ข่าว</button>
</form>
{% endblock %}
