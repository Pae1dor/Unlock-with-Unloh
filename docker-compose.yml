services:
  db:
    image: postgres:16
    container_name: islamapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: islamapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - islamapp_pgdata:/var/lib/postgresql/data

volumes:
  islamapp_pgdata:
