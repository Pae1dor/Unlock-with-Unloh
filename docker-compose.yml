services:
  db:
    image: postgres:16
    container_name: islamapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: islamapp
      POSTGRES_USER: postgres
      # from .env (never committed). An existing volume keeps the password it was
      # first created with, so changing it here alone locks the app out.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port: only the app container reaches the database, over the
    # compose network. (Host port 5432 may also be taken by a local PostgreSQL.)
    volumes:
      - islamapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d islamapp"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: islamapp_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/islamapp
    ports:
      - "9999:9999"
    volumes:
      # QR images made by `make seed` survive rebuilding the container
      - ./static/qr:/code/static/qr
    depends_on:
      db:
        condition: service_healthy

volumes:
  islamapp_pgdata:
