<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B5E3A">
  <title>ไม่มีการเชื่อมต่อ</title>
  <style>
    :root { --green: #1B5E3A; --bg: #F7F5F0; --text: #1f2a24; --muted: #5d6b63; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    button {
      border: 0; border-radius: 12px; padding: 12px 28px; font: inherit; font-weight: 600;
      background: var(--green); color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/img/icon-192.png" alt="">
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ตรวจสอบการเชื่อมต่อของคุณ แล้วลองอีกครั้ง</p>
    <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
  </main>
</body>
</html>
